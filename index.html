<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#050608" />
    <title>Chess Arena</title>
    <link rel="icon" href="./assets/chess-logo.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" defer src="./app.js"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T3CHNX8CX6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-T3CHNX8CX6');
    </script>
  </head>
  <body>
    <main class="shell">
      <section class="panel panel--landing" id="landing">
        <div class="panel__header panel__header--landing">
          <h1 class="page-title">
            <img class="page-title__logo" src="./assets/chess-logo.svg" alt="Chess logo" />
            <span>Chess</span>
          </h1>
        </div>

        <div class="mode-grid">
          <button id="startHumanBtn" class="mode-card" type="button">Local PvP</button>

          <div class="mode-card mode-card--pve">
            <div class="mode-card__label">PvE</div>
            <div class="mode-card__choices">
              <button id="startAiWhiteBtn" class="mode-chip" type="button">Start as White</button>
              <button id="startAiBlackBtn" class="mode-chip" type="button">Start as Black</button>
            </div>
          </div>
        </div>

        <section class="about-card card" aria-labelledby="aboutTitle">
          <h2 id="aboutTitle">About</h2>
          <div class="markdown-content" id="aboutContent">
            <p class="about-loading">Loading…</p>
          </div>
        </section>
      </section>

      <section class="panel panel--game is-hidden" id="gameView">
        <div class="panel__header panel__header--game">
          <div class="page-title-row">
            <h1 class="page-title">
              <img class="page-title__logo" src="./assets/chess-logo.svg" alt="Chess logo" />
              <span>Chess</span>
            </h1>
            <button id="backBtn" class="toolbar__btn toolbar__btn--inline" type="button">Mode select</button>
          </div>
        </div>

        <div class="toolbar">
          <button id="resetBtn" class="toolbar__btn" type="button">Restart game</button>
          <button id="undoBtn" class="toolbar__btn" type="button">Undo move</button>
        </div>

        <div class="turn-strip">
          <span id="statusText">Choose a piece to see legal moves</span>
        </div>

        <div class="game-layout">
          <div class="board-wrap">
            <div class="board-body">
              <div class="board-axes board-axes--left" id="leftRanks"></div>
              <div class="board" id="board" aria-label="Chess board"></div>
            </div>
            <div class="board-axes board-axes--bottom" id="bottomFiles"></div>
          </div>

          <aside class="sidebar">
            <div class="card">
              <h2>Move History</h2>
              <div class="history-list" id="historyList"></div>
            </div>
          </aside>
        </div>
      </section>

      <div class="promotion-modal is-hidden" id="promotionModal" role="dialog" aria-modal="true" aria-labelledby="promotionTitle">
        <div class="promotion-modal__backdrop"></div>
        <div class="promotion-modal__panel">
          <h2 id="promotionTitle">Choose promotion</h2>
          <div class="promotion-options" id="promotionOptions"></div>
        </div>
      </div>

      <footer class="site-footer">
        <p>Copyright © Winchell Wang <span id="copyrightYear"></span></p>
        <a class="github-link" href="https://github.com/WinchellWang/chess" target="_blank" rel="noopener noreferrer">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22">
            <path fill="currentColor" d="M12 .7a11.5 11.5 0 0 0-3.64 22.4c.58.1.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.52-1.34-1.29-1.69-1.29-1.69-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.78 2.72 1.27 3.39.97.1-.75.4-1.27.74-1.56-2.57-.29-5.27-1.29-5.27-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.47.11-3.05 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.75 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.58.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.71 5.39-5.29 5.68.42.36.79 1.07.79 2.16v3.2c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z" />
          </svg>
          <span>Star this on GitHub</span>
        </a>
      </footer>
    </main>
  </body>
</html>
